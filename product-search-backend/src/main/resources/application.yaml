server:
    port: ${SERVER_PORT:8080}
spring:
    datasource:
        # Credentials come from the environment: never commit them to a public repository
        url: ${DB_URL:jdbc:postgresql://localhost:5432/product-db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:}
        driver-class-name: org.postgresql.Driver
    sql:
        init:
            mode: always
            encoding: UTF-8
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 20MB
    mvc:
        # 400 responses carry a JSON body (RFC 9457) explaining what is wrong with the request
        problemdetails:
            enabled: true
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        defer-datasource-initialization: true

app:
    images:
        path: ./uploads/products/

logging:
    level:
        root: INFO
